<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login LMS</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('prasmulbg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        {
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        .login-form {
            display: flex;
            flex-direction: column;
        }
        .login-form input {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .login-form button {
            background-color: grey;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
        }
    </style>
</head>
    <body style="background-color: white;">
        <div class="container">
            <img src="logo_upm_biru.png" alt="Logo">
            <from class="login-form">   
                <input type="email" id="email" name="email" placeholder="Username or email" required>
                <input type="password" id="password" name="password" placeholder="Password" required>
                <button type="submit">Log In</button>
                <br>
                <a href="https://www.google.com/?client=safari" style="color: grey;">Lost Password?</a>
            </from>
        </div>
    </body>
